name: CI
on:
  push:
    branches: [ '**' ]
  pull_request:
    paths-ignore:
      - 'doc/*.rst'
  schedule:
    - cron: '17 3 * * 0'

jobs:
  flake8:
    name: Flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Main Script
        run: |
          pip install flake8 flake8-quotes flake8-bugbear
          flake8
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Main Script
        run: |
          pip install ruff
          ruff check excee
  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.14"
          environment-file: .test-conda-env.yml
          miniforge-version: latest
          conda-remove-defaults: "true"
      - name: Conda info
        run: conda info
      - name: Conda list
        run: conda list
      - name: Main Script
        run: |
          pip install pyyaml
          pip install -e .
          pylint --disable W0511 test/ excee/
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.14"
          environment-file: .test-conda-env.yml
          miniforge-version: latest
          conda-remove-defaults: "true"
      - name: Conda info
        run: conda info
      - name: Conda list
        run: conda list
      - name: Main Script
        run: |
          pip install -e .
          pytest test
