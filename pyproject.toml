[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=42",
    "wheel",
]

[tool.setuptools.packages.find]
exclude = ["data"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --durations=30 --tb=native"

[tool.pylint.main]
recursive = true
jobs = 4
ignore = [".git", "__pycache__", "build", "dist"]

[tool.pylint."messages control"]
disable = "all"
enable = "E,F,W0511"

[tool.pylint.REPORTS]
output-format = "colorized"

[project]
name = "excee"
version = "2022.1"
license = {file = "LICENSE"}
description = "an emcee wrapper using xarray"
readme = "README.rst"
authors = [
    {name = "Zachary J Weiner"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.18.5",
]

[project.urls]
homepage = "https://github.com/zachjweiner/excee"
source = "https://github.com/zachjweiner/excee"
documentation = "https://excee.readthedocs.io/en/latest/"