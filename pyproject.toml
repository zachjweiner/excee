[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=42",
    "wheel",
]

[tool.setuptools.packages.find]
exclude = ["data"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --durations=30 --tb=native"

[tool.pylint.main]
recursive = true
jobs = 4
ignore = [".git", "__pycache__", "build", "dist"]

[tool.pylint."messages control"]
disable = "all"
enable = "E,F,W0511"

[tool.pylint.REPORTS]
output-format = "colorized"

[tool.ruff]
line-length = 85
lint.select = [
  "E", "F", "W", # flake8
  "Q",           # flake8-quotes
  "B",  "B904",  # flake8-bugbear
  # "I",         # isort
  # "ARG",       # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  # "EM",        # flake8-errmsg
  "ICN",         # flake8-import-conventions
  # "ISC",       # flake8-implicit-str-concat
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  # "RET",       # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
]
lint.ignore = ["E402", "E226", "PLR2004", "B905", "SIM105", "PLR091", "PLC", "PLW2901", "RUF022", "PT028"]
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"test/*.py" = ["T201", "PT011"]

[tool.mypy]
files = ["excee/"]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
strict_concatenate = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "emcee.*",
    "h5py.*",
]
ignore_missing_imports = true

[project]
name = "excee"
version = "2026.1"
license = {file = "LICENSE"}
description = "an emcee wrapper using xarray"
readme = "README.rst"
authors = [
    {name = "Zachary J Weiner"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.15",
    "emcee",
    "xarray",
    "h5py",
    "h5netcdf",
    "arviz_stats",
]

[project.urls]
homepage = "https://github.com/zachjweiner/excee"
source = "https://github.com/zachjweiner/excee"
documentation = "https://excee.readthedocs.io/en/latest/"
